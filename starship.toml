add_newline = true
command_timeout = 500

format = """
$username$hostname $directory$git_branch$git_status$conda${env_var.SLURM_JOB_ID}$cmd_duration
$character"""

[username]
show_always = true
format = "[jeremy]($style)"
style_user = "bold #bb9af7"

[hostname]
ssh_only = true
trim_at = "."
format = "[@$hostname]($style)"
style = "bold #bb9af7"

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold #7aa2f7"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "#9ece6a"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "#e0af68"

[conda]
ignore_base = true
format = "[🅒 $environment]($style) "
style = "#7dcfff"

[env_var.SLURM_JOB_ID]
format = "[slurm:$env_value]($style) "
style = "#ff9e64"

[cmd_duration]
min_time = 3000
format = "[took $duration]($style)"
style = "#565f89"

[character]
success_symbol = "[❯](bold #7aa2f7)"
error_symbol = "[❯](bold #f7768e)"
